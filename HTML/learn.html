<!DOCTYPE html>
<html>
<head>
  <style>
    .card {
      width: 200px;
      height: 100px;
      margin: 10px;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      font-size: 20px;
    }
  </style>
</head>
<body>

  <!-- 3 cards -->
  <div class="card" id="card1">Card 1</div>
  <div class="card" id="card2">Card 2</div>
  <div class="card" id="card3">Card 3</div>

  <script>
    // 3 colors
    const colors = ["red", "blue", "green"];

    // apply the colors
    document.getElementById("card1").style.background = colors[0];
    document.getElementById("card2").style.background = colors[1];
    document.getElementById("card3").style.background = colors[2];
  </script>

</body>
</html>
