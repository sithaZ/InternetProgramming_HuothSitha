<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bouncing Game</title>
    <style>
      body {
        margin: 0;
        background: #111;
        color: #eee;
        font: 16px system-ui;
        display: grid;
        place-items: center;
        height: 100vh;
      }
      canvas {
        background: #222222;
        border: 2px solid #555;
      }
      #ui {
        position: fixed;
        top: 10px;
        left: 10px;
      }
      button {
        margin-left: 8px;
      }
    </style>
  </head>
  <body>
    <div id="ui">
      Score: <span id="score">0</span> 
      High Score: <span id="highScore">0</span> 
      <button id="restart">restart</button>
    </div>

    <canvas id="game" width="480" height="320"></canvas>
    <script>
      // ==== Some setting values ====
      const CANVAS_W = 800;
      const CANVAS_H = 450;
      const BALL_SPEED = 2;
      const PADDLE_SPEED = 4;
      const PADDLE_W = 120;
      const PADDLE_H = 12;
      const HIGH_SCORE_KEY = 'bouncingGameHighScore';

      let score = 0;
      let running = true;
      let highScore = 0;

      // Ball & paddle
      const ball = {
        x: CANVAS_W / 2,
        y: CANVAS_H / 2,
        r: 10,
        dx: BALL_SPEED,
        dy: BALL_SPEED,
      };
      const paddle = {
        x: CANVAS_W / 2 - PADDLE_W / 2,
        y: CANVAS_H - 40,
        w: PADDLE_W,
        h: PADDLE_H,
        speed: PADDLE_SPEED,
        dx: 0,
      };

      // === Global Variables ===
      const canvas = document.getElementById("game");
      const ctx = canvas.getContext("2d");
      const scoreEl = document.getElementById("score");
      const restartBtn = document.getElementById("restart");
      const highScoreEl = document.getElementById("highScore");

      // Ensure canvas matches tunables
      canvas.width = CANVAS_W;
      canvas.height = CANVAS_H;

      // === Functions ===
      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Ball
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
        ctx.fillStyle = "#facc15";
        ctx.fill();

        // Paddle
        ctx.fillStyle = "#ffe600";
        ctx.fillRect(paddle.x, paddle.y, paddle.w, paddle.h);

        // Game over message
        if (!running) {
          ctx.font = "bold 32px system-ui";
          ctx.fillStyle = "white";
          ctx.textAlign = "center";
          ctx.fillText("GAME OVER", CANVAS_W / 2, CANVAS_H / 2);

          ctx.font = "18px system-ui";
          ctx.fillStyle = "white";
          ctx.fillText(
            "Click Restart to play again",
            CANVAS_W / 2,
            CANVAS_H / 2 + 40
          );
        }
      }

      // Keyboard controls
      let leftPressed = false;
      let rightPressed = false;

      document.addEventListener("keydown", (e) => {
        if (e.key === "ArrowLeft" || e.key === "Left") {
          leftPressed = true;
        } else if (e.key === "ArrowRight" || e.key === "Right") {
          rightPressed = true;
        } else if (e.key === "R" || e.key === "r") {
          init();
        }
      });

      document.addEventListener("keyup", (e) => {
        if (e.key === "ArrowLeft" || e.key === "Left") {
          leftPressed = false;
        } else if (e.key === "ArrowRight" || e.key === "Right") {
          rightPressed = false;
        }
      });

      restartBtn.addEventListener("click", () => {
        init();
      });

      function movePaddle() {
        paddle.dx = 0;

        if (leftPressed) {
          paddle.dx = -paddle.speed;
        }
        if (rightPressed) {
          paddle.dx = paddle.speed;
        }

        paddle.x += paddle.dx;

        if (paddle.x < 0) paddle.x = 0;
        if (paddle.x + paddle.w > canvas.width) {
          paddle.x = canvas.width - paddle.w;
        }
      }

      function moveBall() {
        ball.x += ball.dx;
        ball.y += ball.dy;

        // Left & right walls
        if (ball.x - ball.r <= 0 || ball.x + ball.r >= canvas.width) {
          ball.dx *= -1;
        }

        // Top wall
        if (ball.y - ball.r <= 0) {
          ball.dy *= -1;
        }
      }

      function checkCollision() {
        const hitsPaddle =
          ball.y + ball.r >= paddle.y &&
          ball.x > paddle.x &&
          ball.x < paddle.x + paddle.w;

        if (hitsPaddle && ball.dy > 0) {
          ball.dy *= -1.205;
          score += 1;
          updateUI();
        }

        // Missed paddle — game over
        if (ball.y + ball.r > canvas.height) {
          running = false;
          if (score > highScore) {
            highScore = score;
            saveHighScore();
          }
        }
      }

      function updateUI() {
        scoreEl.textContent = score;
        highScoreEl.textContent = highScore;
      }

      function saveHighScore() {
        try {
          const scores = loadScores();
          scores.push({ score: highScore, date: Date.now() });
          scores.sort((a, b) => b.score - a.score);
          const topScores = scores.slice(0, 10);
          sessionStorage.setItem(HIGH_SCORE_KEY, JSON.stringify(topScores));
        } catch (e) {
          console.log('Unable to save high score');
        }
      }

      function loadScores() {
        try {
          const data = sessionStorage.getItem(HIGH_SCORE_KEY);
          return data ? JSON.parse(data) : [];
        } catch (e) {
          return [];
        }
      }

      function loadHighScore() {
        const scores = loadScores();
        if (scores.length > 0) {
          highScore = scores[0].score;
        }
        updateUI();
      }

      function init() {
        score = 0;
        running = true;
        ball.x = CANVAS_W / 2;
        ball.y = CANVAS_H / 2;
        ball.dx = BALL_SPEED;
        ball.dy = BALL_SPEED;
        paddle.x = CANVAS_W / 2 - PADDLE_W / 2;
        updateUI();
      }

      function loop() {
        if (running) {
          movePaddle();
          moveBall();
          checkCollision();
        }
        draw();
        requestAnimationFrame(loop);
      }

      loadHighScore();
      init();
      loop();
    </script>
  </body>
</html>
